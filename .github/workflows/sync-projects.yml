# Regenerates the project cards in projects.html and the home page's featured
# cards in index.html from aidanlenahan/projectroot's projects.json and commits
# the result, along with a snapshot of projects.json and its images in
# projects-data/. If projectroot can't be fetched the job fails before touching
# anything, so the last good snapshot keeps being served.
name: Sync projects

on:
  repository_dispatch:
    types: [projects-updated]   # sent by projectroot's notify-portfolio workflow
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'        # daily fallback in case a dispatch is missed

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Keeps the default persist-credentials so the commit step can push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: aidanlenahan/projectroot
          ref: main
          path: _projectroot
          persist-credentials: false
          sparse-checkout: |
            projects.json
            img/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: node scripts/build-projects.mjs _projectroot/projects.json projects.html index.html

      - name: Commit if changed
        run: |
          git add -A projects.html index.html projects-data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync projects from projectroot"
          # main may have moved since checkout; replay our commit on top of it.
          git pull --rebase
          git push
