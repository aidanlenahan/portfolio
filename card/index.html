<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aidan Lenahan's digital business card - contact info and quick save">
    <meta name="robots" content="noindex, nofollow">
    <title>Contact Card | Aidan Lenahan</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" href="../favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="../favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
    </script>
    <style>
        /* Page-specific styles for the digital business card.
           Everything else (colors, fonts, dark mode) inherits from css/style.css */
        .card-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-sm);
        }

        .vcard {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .vcard-photos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .vcard-photo {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-primary);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
        }

        .vcard-name {
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .vcard-role {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
        }

        .vcard-details {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            text-align: left;
            margin-bottom: var(--spacing-lg);
        }

        .vcard-details .contact-method a,
        .vcard-details .contact-method p {
            font-weight: 600;
        }

        .vcard-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .vcard-social {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .vcard-toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(12px);
            background-color: var(--card-bg);
            border: 1px solid var(--accent-primary);
            color: var(--text-primary);
            padding: 0.75rem 1.25rem;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-md);
            font-size: 0.9rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .vcard-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .qr-fab {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
            z-index: 20;
        }

        .qr-fab:hover,
        .qr-fab:focus-visible {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: scale(1.05);
        }

        .qr-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-sm);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-fast);
            z-index: 30;
        }

        .qr-modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .qr-modal {
            background-color: var(--card-bg);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-lg);
            max-width: 300px;
            width: 100%;
            text-align: center;
            position: relative;
            transform: translateY(10px);
            transition: transform var(--transition-fast);
        }

        .qr-modal-overlay.show .qr-modal {
            transform: translateY(0);
        }

        .qr-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
        }

        .qr-modal-close:hover {
            color: var(--accent-primary);
        }

        .qr-modal h2 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .qr-modal img {
            width: 200px;
            height: 200px;
            border-radius: var(--border-radius-md);
            margin: 0 auto var(--spacing-sm);
            display: block;
        }

        .qr-modal p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K4JBFNH3"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <section class="card-page">
        <div class="container">
            <div class="vcard">
                <div class="vcard-photos">
                    <img src="../files/headshot300x300.png" alt="Aidan Lenahan" class="vcard-photo">
                    <img src="../files/shea-communications.jpg" alt="Shea Communications Inc." class="vcard-photo">
                </div>
                <h1 class="vcard-name">Aidan Lenahan</h1>
                <p class="vcard-role">Brand Ambassador &middot; Shea Communications Inc.</p>

                <div class="vcard-details">
                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-phone"></i></div>
                        <div class="method-content">
                            <h3>Phone</h3>
                            <a href="tel:+17325303704">732-530-3704</a>
                        </div>
                    </div>

                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-envelope"></i></div>
                        <div class="method-content">
                            <h3>Email</h3>
                            <a href="mailto:aidan@sheacom.com">aidan@sheacom.com</a>
                        </div>
                    </div>

                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-globe"></i></div>
                        <div class="method-content">
                            <h3>Website</h3>
                            <a href="https://sheacom.com" target="_blank" rel="noopener noreferrer">sheacom.com</a>
                        </div>
                    </div>

                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div class="method-content">
                            <h3>Location</h3>
                            <p>Little Silver, New Jersey</p>
                        </div>
                    </div>
                </div>

                <div class="vcard-actions">
                    <button class="btn btn-primary btn-block" id="saveContactBtn">
                        <i class="fas fa-address-card"></i> Save to Contacts
                    </button>
                    <a href="mailto:aidan@sheacom.com" class="btn btn-outline btn-block">
                        <i class="fas fa-envelope"></i> Send an Email
                    </a>
                </div>

                <div class="vcard-social">
                    <a href="https://github.com/aidanlenahan" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="social-link">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/aidanlenahan" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="social-link">
                        <i class="fab fa-linkedin"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div class="vcard-toast" id="vcardToast">Saved — open the download to add to your contacts</div>

    <button class="qr-fab" id="qrFabBtn" aria-haspopup="dialog" aria-label="Show QR code for this card">
        <i class="fas fa-qrcode"></i>
    </button>

    <div class="qr-modal-overlay" id="qrModalOverlay">
        <div class="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
            <button class="qr-modal-close" id="qrModalClose" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
            <h2 id="qrModalTitle">Scan to open this card</h2>
            <img src="../files/card-qr.svg" alt="QR code linking to aidanlenahan.com/card">
            <p>aidanlenahan.com/card</p>
        </div>
    </div>

    <script>
        document.getElementById('saveContactBtn').addEventListener('click', function () {
            const first = 'Aidan';
            const last = 'Lenahan';
            const org = 'Shea Communications Inc.';
            const title = 'Brand Ambassador';
            const phone = '+17325303704';
            const email = 'aidan@sheacom.com';
            const url = 'https://sheacom.com';
            const photoUrl = window.location.origin + '/files/headshot300x300.png';

            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${last};${first};;;`,
                `FN:${first} ${last}`,
                org ? `ORG:${org}` : '',
                title ? `TITLE:${title}` : '',
                `TEL;TYPE=CELL:${phone}`,
                `EMAIL;TYPE=INTERNET:${email}`,
                `URL:${url}`,
                `PHOTO;VALUE=URI:${photoUrl}`,
                'END:VCARD'
            ].filter(Boolean).join('\n');

            const blob = new Blob([vcard], { type: 'text/vcard' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${first}-${last}.vcf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            const toast = document.getElementById('vcardToast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3200);
        });

        const qrFabBtn = document.getElementById('qrFabBtn');
        const qrModalOverlay = document.getElementById('qrModalOverlay');
        const qrModalClose = document.getElementById('qrModalClose');

        function openQrModal() {
            qrModalOverlay.classList.add('show');
        }

        function closeQrModal() {
            qrModalOverlay.classList.remove('show');
        }

        qrFabBtn.addEventListener('click', openQrModal);
        qrModalClose.addEventListener('click', closeQrModal);
        qrModalOverlay.addEventListener('click', function (e) {
            if (e.target === qrModalOverlay) closeQrModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeQrModal();
        });
    </script>
</body>
</html>
