    <style>
        /* Page-specific styles for the digital business card.
           Everything else (colors, fonts, dark mode) inherits from css/style.css */
        .card-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-sm);
        }

        .vcard {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .vcard-photos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .vcard-photo {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-primary);
            box-shadow: var(--shadow-md);
            flex-shrink: 0;
        }

        .vcard-name {
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .vcard-role {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
        }

        .vcard-details {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            text-align: left;
            margin-bottom: var(--spacing-lg);
        }

        .vcard-details .contact-method a,
        .vcard-details .contact-method p {
            font-weight: 600;
        }

        .vcard-actions {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .vcard-social {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .vcard-toast {
            position: fixed;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%) translateY(12px);
            background-color: var(--card-bg);
            border: 1px solid var(--accent-primary);
            color: var(--text-primary);
            padding: 0.75rem 1.25rem;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-md);
            font-size: 0.9rem;
            width: max-content;
            max-width: calc(100vw - 32px);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .vcard-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .qr-fab {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
            z-index: 20;
        }

        .qr-fab:focus-visible {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: scale(1.05);
        }

        @media (hover: hover) {
            .qr-fab:hover {
                color: var(--accent-primary);
                border-color: var(--accent-primary);
                transform: scale(1.05);
            }
        }

        .qr-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-sm);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-fast);
            z-index: 30;
        }

        .qr-modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .qr-modal {
            background-color: var(--card-bg);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-lg);
            max-width: 300px;
            width: 100%;
            text-align: center;
            position: relative;
            transform: translateY(10px);
            transition: transform var(--transition-fast);
        }

        .qr-modal-overlay.show .qr-modal {
            transform: translateY(0);
        }

        .qr-modal-close {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .qr-modal-close:hover {
            color: var(--accent-primary);
        }

        .qr-modal h2 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .qr-modal img {
            width: 200px;
            height: 200px;
            border-radius: var(--border-radius-md);
            margin: 0 auto var(--spacing-sm);
            display: block;
        }

        .qr-modal p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <section class="card-page">
        <div class="container">
            <div class="vcard">
                <div class="vcard-photos">
                    <img src="../files/headshot-300.webp" alt="Aidan Lenahan" class="vcard-photo" width="108" height="108">
                    <img src="../files/shea-communications-216.webp" alt="Shea Communications Inc." class="vcard-photo" width="108" height="108">
                </div>
                <h1 class="vcard-name">Aidan Lenahan</h1>
                <p class="vcard-role">Territory Sales Representative &middot; Shea Communications Inc.</p>

                <h2 class="sr-only">Contact details</h2>
                <div class="vcard-details">
                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-phone" aria-hidden="true"></i></div>
                        <div class="method-content">
                            <h3>Phone</h3>
                            <a href="tel:+17325303704">732-530-3704</a>
                        </div>
                    </div>

                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-envelope" aria-hidden="true"></i></div>
                        <div class="method-content">
                            <h3>Email</h3>
                            <a href="mailto:aidan@sheacom.com">aidan@sheacom.com</a>
                        </div>
                    </div>

                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-globe" aria-hidden="true"></i></div>
                        <div class="method-content">
                            <h3>Website</h3>
                            <a href="http://sheacom.com" target="_blank" rel="noopener noreferrer">sheacom.com<span class="sr-only"> (opens in new tab)</span></a>
                        </div>
                    </div>

                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-map-marker-alt" aria-hidden="true"></i></div>
                        <div class="method-content">
                            <h3>Location</h3>
                            <p>Little Silver, New Jersey</p>
                        </div>
                    </div>
                </div>

                <div class="vcard-actions">
                    <button class="btn btn-primary btn-block" id="saveContactBtn">
                        <i class="fas fa-address-card" aria-hidden="true"></i> Save to Contacts
                    </button>
                    <a href="mailto:aidan@sheacom.com" class="btn btn-outline btn-block">
                        <i class="fas fa-envelope" aria-hidden="true"></i> Send an Email
                    </a>
                </div>

                <div class="vcard-social">
                    <a href="https://github.com/aidanlenahan" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in new tab)" class="social-link">
                        <i class="fab fa-github" aria-hidden="true"></i>
                    </a>
                    <a href="https://linkedin.com/in/aidanlenahan" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in new tab)" class="social-link">
                        <i class="fab fa-linkedin" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div class="vcard-toast" id="vcardToast" role="status"></div>

    <button class="qr-fab" id="qrFabBtn" aria-haspopup="dialog" aria-label="Show QR code for this card">
        <i class="fas fa-qrcode" aria-hidden="true"></i>
    </button>

    <div class="qr-modal-overlay" id="qrModalOverlay">
        <div class="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
            <button class="qr-modal-close" id="qrModalClose" aria-label="Close">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
            <h2 id="qrModalTitle">Scan to open this card</h2>
            <img src="../files/card-qr.svg" alt="QR code linking to aidanlenahan.com/card" width="200" height="200" loading="lazy">
            <p>aidanlenahan.com/card</p>
        </div>
    </div>

    <script>
        document.getElementById('saveContactBtn').addEventListener('click', function () {
            const first = 'Aidan';
            const last = 'Lenahan';
            const org = 'Shea Communications Inc.';
            const title = 'Territory Sales Representative';
            const phone = '+17325303704';
            const email = 'aidan@sheacom.com';
            const url = 'http://sheacom.com';
            const photoUrl = window.location.origin + '/files/headshot-300.jpg';

            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${last};${first};;;`,
                `FN:${first} ${last}`,
                org ? `ORG:${org}` : '',
                title ? `TITLE:${title}` : '',
                `TEL;TYPE=CELL:${phone}`,
                `EMAIL;TYPE=INTERNET:${email}`,
                `URL:${url}`,
                `PHOTO;VALUE=URI:${photoUrl}`,
                'END:VCARD'
            ].filter(Boolean).join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${first}-${last}.vcf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            const toast = document.getElementById('vcardToast');
            toast.textContent = 'Saved — open the download to add to your contacts';
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                toast.textContent = '';
            }, 3200);
        });

        const qrFabBtn = document.getElementById('qrFabBtn');
        const qrModalOverlay = document.getElementById('qrModalOverlay');
        const qrModalClose = document.getElementById('qrModalClose');

        function openQrModal() {
            qrModalOverlay.classList.add('show');
        }

        function closeQrModal() {
            qrModalOverlay.classList.remove('show');
        }

        qrFabBtn.addEventListener('click', openQrModal);
        qrModalClose.addEventListener('click', closeQrModal);
        qrModalOverlay.addEventListener('click', function (e) {
            if (e.target === qrModalOverlay) closeQrModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeQrModal();
        });
    </script>
